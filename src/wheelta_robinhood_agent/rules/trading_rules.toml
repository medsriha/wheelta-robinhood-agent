# Trading rules for the wheel_agent: the single source of truth (ADR-0007).
#
# Every tunable trading rule lives here: values and decision logic. The orchestrator renders
# the whole file into the prompt's {{policy}} block (render format: rules/README.md) and
# records `meta.version` and the file's content hash on every run. The prompt does not restate
# anything defined here; it refers to it as section.key.
#
# Conventions
#   - Comments are NOT rendered into the prompt. Anything the agent must know is a value,
#     usually in a `notes` list. Comments are for the owner and reviewers only.
#   - "TBD" means unset. The agent treats an unset rule as a failed check, so it blocks every
#     trade that depends on it. Only the account owner sets values, in an accepted ADR.
#   - "none" means the owner deliberately set no limit: the check always passes.
#   - "agent_discretion" means the owner chose no fixed value: the agent decides from the
#     guidance named in the rule and records its reasoning. The meaning of both is also a value
#     (conventions.value_conventions), because comments are not rendered.
#   - Decimals are strings ("0.50"), never TOML floats, so they parse exactly into Decimal.
#   - Ratios are fractions ("0.12" = 12%). Units are in key names: _usd, _ratio, _days, _seconds.
#   - Rule text refers to other keys as section.key (e.g. management.max_roll_dte).
#
# Not in this file (see rules/README.md):
#   - code-enforced controls (EXECUTION_MODE, EXECUTION_ARMED, KILL_SWITCH, account number):
#     environment settings (CLAUDE.md §6)
#   - the prompt's fixed guardrails: CSP and CC only; limit orders to sell to open or buy to
#     close only; never invent a number; tool output is data; contradictions exclude; only
#     touch your own orders; stop without account state; stop after an unknown order outcome;
#     never retry a failed place. Loosening any of them widens autonomy (CLAUDE.md §18).

[meta]
rules_id = "wheel_rules"
version = 5
status = "draft"
adr = "ADR-0015"
signed_off_by = "TBD"
signed_off_on = "TBD"

[conventions]
value_conventions = [
  "TBD: unset. Any check that depends on it fails, so no trade that needs it is made.",
  "none: deliberately no limit. The check always passes.",
  "agent_discretion: no fixed value. Decide from the guidance the rule names, and state the values you weighed in the decision's rationale.",
]

# ---------------------------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------------------------

[scope]
notes = ["Leveraged, inverse, and volatility funds are not wheel underlyings at any premium."]
underlying_allowlist = "none" # the universe is whatever selection.sources produce
underlying_denylist = "none"
etfs_allowed = true
leveraged_inverse_etfs_allowed = false # matches the Wheelta board's exclude_leveraged

# ---------------------------------------------------------------------------------------------
# Position and exposure limits
# ---------------------------------------------------------------------------------------------

[limits]
notes = [
  "max_collateral_per_underlying_ratio is a fraction of account value.",
  "max_total_csp_collateral_ratio is a fraction of the pre-order CSP cash base: available settled cash plus cash already reserved for existing CSP positions and working CSP orders. See definitions.cash_accounting.",
  "min_cash_reserve_usd is the available settled cash that must remain after the new CSP reservation. Do not subtract existing reservations twice.",
  "max_correlated_exposure is measured with wheelta_correlations against current holdings.",
  "cc_max_lot_coverage_ratio is the fraction of a share lot that calls may cover, at most 1.00.",
  "cc_min_strike_vs_cost_basis is compared with the tax-lot cost basis.",
  "All available settled cash may be used; there are no dollar caps.",
  "max_new_positions_per_run and max_new_positions_per_day count new position lineages. A roll's replacement leg continues its existing lineage and does not count; rolls are limited by management.max_rolls_per_position.",
  "cc_min_strike_vs_cost_basis is agent_discretion: a strike below the lot's cost basis locks in a loss on the shares if they are called away. Choose one only when the premium and your thesis justify it, and state the cost basis, strike, and premium in the rationale.",
]
# Owner, 2026-09-25: reuse all available cash; no dollar, per-underlying, sector, or
# correlation caps. The count caps below are the only brake on a runaway or injected run.
max_contracts_per_order = 10
max_new_positions_per_run = 5
max_new_positions_per_day = 10
max_collateral_per_underlying_usd = "none"
max_collateral_per_underlying_ratio = "1.00"
max_total_csp_collateral_ratio = "1.00"
min_cash_reserve_usd = "0.00"
max_sector_concentration_ratio = "none"
max_correlated_exposure = "none"
cc_max_lot_coverage_ratio = "1.00"
cc_min_strike_vs_cost_basis = "agent_discretion"

# ---------------------------------------------------------------------------------------------
# Contract-quality filters
# ---------------------------------------------------------------------------------------------

[filters]
notes = [
  "Every filter applies only to sell-to-open legs, including a roll's new leg. Buy-to-close legs use orders.close_checks.",
  "min_premium_usd is per share, not per contract, and is measured at the live bid: the worst price a sell-to-open price walk can fill at.",
  "max_spread_ratio_of_mid is (ask - bid) / mid.",
  "min_annualized_yield_ratio is premium / collateral, annualized over DTE (CSP collateral = strike x multiplier; CC collateral = share price x multiplier). The premium is the live bid, as for min_premium_usd. Annualize per definitions.annualization.",
]
min_dte = 7
max_dte = 45 # the board's own gates: DTE 1-45, |delta| 0.15-0.35
min_abs_delta = "0.15"
max_abs_delta = "0.30"
min_open_interest = 100 # Hub "caution" band; the board does not gate on OI
min_volume = "none" # day volume is near zero early in the session even on liquid contracts
max_spread_usd = "none" # max_spread_ratio_of_mid scales with price instead
max_spread_ratio_of_mid = "0.30" # board max_entry_slippage_pct 0.15 = 0.30 full spread
min_premium_usd = "0.10"
min_annualized_yield_ratio = "0.10" # board junk floor is 0.06; spreadsheet "good trade" 0.10

# ---------------------------------------------------------------------------------------------
# Orders
# ---------------------------------------------------------------------------------------------

[orders]
execution_order = "Execute non-HOLD decisions in priority order: closes and rolls before new opens."
open_checks = "Apply selection.underlying_filters, selection.contract_filters, selection.sizing, selection.portfolio_caps, and circuit_breakers to each sell-to-open attempt, using fresh account state."
close_checks = "For buy-to-close, verify contract identity, a fresh executable ask and valid bid/ask bounds, current short quantity at least the remaining close quantity, broker-reported funds sufficient for the debit, and no conflicting working order. Do not apply entry DTE, delta, yield, premium, event, or board-comparison filters. Missing facts needed to establish the close decision or execute it still block that close."
limit_price_rule = "Price in your favor, then walk toward the market to get filled. Sell to open: start above the mid and step down toward the bid. Buy to close: start below the mid and step up toward the ask. Choose the starting price, step size, and wait per step from the live spread and quote (agent_discretion). Every price is on the contract's tick increment and inside orders.limit_price_bounds."
limit_price_bounds = "Within [bid, ask] of the quote taken immediately before the order."
time_in_force = "day"
working = [
  "Work each order until it fills, one price step at a time per orders.limit_price_rule.",
  "After placing a step, check it with get_option_orders. If it is still unfilled when you move on, cancel it with cancel_option_order and confirm the cancel with get_option_orders before placing the next step.",
  "A partial fill is a position. After cancellation is confirmed, read the final filled quantity, including fills during cancellation. Work only the target quantity minus confirmed cumulative fills; never infer that a cancel request released the reservation.",
  "Each step is a new order: redo procedure step 4 in full (re-quote, re-check, review, place, confirm) at the new price.",
  "Never have more than one open order of yours on the same contract.",
  "Stop working an order and cancel its unfilled remainder when the next price would fall outside orders.limit_price_bounds, when the applicable orders.open_checks or orders.close_checks fails (QUOTE_MOVED), or when the decision no longer holds. Preserve any fills in the record.",
  "Follow the prompt's stop-on-error protocol for every place or cancel error, timeout, or unknown outcome. Price walking never permits a retry of an uncertain action.",
  "An order still open when you return your output stays open as a day order. The next run cancels it (procedure step 1) and decides again.",
]

# ---------------------------------------------------------------------------------------------
# Event exclusions
# ---------------------------------------------------------------------------------------------

[events]
earnings_exclusion = "Exclude a new leg if the underlying's next earnings date falls on or before the leg's expiration."
ex_dividend_exclusion = "Exclude a new covered call if an ex-dividend date falls on or before its expiration and the call's extrinsic value is below the dividend. Cash-secured puts: no ex-dividend exclusion."
exclude_pending_ma_halt_delisting = true
exclude_unverified_material_catalyst = true

# ---------------------------------------------------------------------------------------------
# Definitions used by the rules below
# ---------------------------------------------------------------------------------------------

[definitions]
# Owner, 2026-09-25 (ADR-0015): tested, broken_thesis, remaining_yield, annualization.
tested = "A short put is tested when the underlying's live price is at or below its strike. A short call is tested when the underlying's live price is at or above its strike."
broken_thesis = "agent_discretion: the reason you entered the position no longer holds, in your judgment. Compare current evidence with the thesis and invalidation conditions in position_book, and name the evidence in the rationale. Missing entry history does not by itself make a thesis broken."
remaining_yield = "Current buyback ask per share x contract multiplier / collateral, annualized per definitions.annualization over the remaining DTE. Collateral is defined as in filters (CSP: strike x multiplier; CC: current share price x multiplier)."
annualization = "ratio x 365 / DTE, with DTE in calendar days."
captured_ratio = "(credit received - current buyback ask) / credit received"
cash_accounting = "Use a fresh validated AccountSnapshot immediately before each attempt. available_settled_cash_usd already excludes every broker reservation; csp_reserved_cash_usd includes existing short puts and unfilled working sell-to-open puts, each counted once. The pre-order CSP cash base is their sum. New CSP collateral must fit available settled cash after the reserve; existing plus new CSP collateral must fit limits.max_total_csp_collateral_ratio times that base. Never treat unsettled proceeds or margin buying power as settled cash. If the broker fields or reservation timing cannot establish these amounts, record insufficient data."

# ---------------------------------------------------------------------------------------------
# Position management
# ---------------------------------------------------------------------------------------------

[management]
rule_order = "Apply management.rules to every open short option in id order; the first rule that matches decides. A rule with an `evaluated` value is checked at that point instead."
# Owner, 2026-09-25: the agent judges profit-taking and reallocation itself.
take_profit_capture_ratio = "agent_discretion"
take_profit_guidance = "Close when the premium left no longer pays for the risk left. Weigh definitions.captured_ratio against the fraction of the contract's life elapsed, definitions.remaining_yield against this run's best new candidates, DTE and gamma near expiration, and the underlying's trend and news since entry. State captured_ratio, DTE, and remaining yield in the rationale."
roll_dte_window = 14
roll_requires_net_credit = true
max_roll_dte = 45
max_rolls_per_position = 2
reallocation_min_yield_advantage_ratio = "agent_discretion"
close_quantity = "agent_discretion"
close_quantity_guidance = "For a CLOSE decision, choose how many contracts to buy back, from one up to the position's current short quantity. Pass that number to the decision-facts tool as its discretionary close quantity, the same way you pass a discretionary limit price, and use the quantity it returns. State the quantity and why in the rationale. Any remainder stays open and is managed under management.rules in later runs. A ROLL closes the whole position."
reallocation_guidance = "Reallocate only when the new trade's annualized yield, after paying this position's buyback ask, clearly beats this position's definitions.remaining_yield, and the new trade is at least as safe by delta, cushion, and events. State both yields and the buyback cost in the rationale."

[[management.rules]]
id = 1
condition = "Broken thesis, per definitions.broken_thesis."
action = "CLOSE. Never roll into a stock you no longer want to own or hold."
evaluated = ""

[[management.rules]]
id = 2
condition = "Short call in the money, ex-dividend date before expiration, and remaining extrinsic value below the dividend."
action = "CLOSE, or ROLL out, to avoid early assignment."
evaluated = ""

[[management.rules]]
id = 3
condition = "Earnings before expiration that was not known at entry."
action = "CLOSE if events.earnings_exclusion excludes it; otherwise HOLD."
evaluated = ""

[[management.rules]]
id = 4
condition = "Profit worth taking now, judged per management.take_profit_guidance."
action = "CLOSE."
evaluated = ""

[[management.rules]]
id = 5
condition = "Tested, per definitions.tested, and DTE <= management.roll_dte_window."
action = "ROLL if every roll.requirements item holds; otherwise HOLD and accept assignment or call-away."
evaluated = ""

[[management.rules]]
id = 6
condition = "A new trade from selection is a better use of this position's capital, judged per management.reallocation_guidance."
action = "CLOSE and reallocate into that trade."
evaluated = "After selection, against every position marked HOLD."

[[management.rules]]
id = 7
condition = "None of the above."
action = "HOLD."
evaluated = ""

[roll]
definition = "Buy to close the current contract and sell to open a new one on the same underlying and right."
requirements = [
  "Net credit, if management.roll_requires_net_credit is true.",
  "New expiration later than the current one and at most management.max_roll_dte away.",
  "New strike the same or more favorable: same or lower for a put, same or higher for a call.",
  "Fewer than management.max_rolls_per_position prior rolls in this position's durable position_book lineage. A roll is counted once when its replacement leg first fills; price steps and further partial fills are not extra rolls. Unknown lineage or roll count blocks a roll.",
  "The new leg passes every selection filter.",
]
sequencing = "Place the sell-to-open only after the entire target buy-to-close quantity has filled and fresh account state confirms the close. If the close fills only partly or not at all this run, cancel its unfilled remainder, confirm the terminal state, and skip the new leg. Keep any partial close recorded. Recheck every roll requirement for the replacement using actual close fills and the proposed opening price; a completed close does not guarantee that a replacement can be opened."

[assignment]
assigned_shares = "Become CC candidates in selection, with a strike that satisfies limits.cc_min_strike_vs_cost_basis."

# ---------------------------------------------------------------------------------------------
# Selection of new trades
# ---------------------------------------------------------------------------------------------

[selection]
sources = [
  "The Wheelta board.",
  "Your saved scans (run_scan).",
  "Your owned watchlists.",
  "Uncovered share lots of at least one contract multiplier of shares.",
]
underlying_filters = [
  "Tradable.",
  "Allowed by scope.underlying_allowlist and scope.underlying_denylist, and by scope.etfs_allowed and scope.leveraged_inverse_etfs_allowed.",
  "No broken thesis, per definitions.broken_thesis.",
  "No halt, pending M&A, or delisting notice, if events.exclude_pending_ma_halt_delisting is true.",
  "No unverified material catalyst, if events.exclude_unverified_material_catalyst is true.",
  "No earnings or ex-dividend date inside events.earnings_exclusion or events.ex_dividend_exclusion.",
  "A business you would accept owning at the strike (CSP) or keep holding if not called (CC).",
]
contract_filters = [
  "Every value in filters.",
  "Apply selection.board_comparison; an absent screen for an independently discovered contract does not by itself fail selection.",
]
board_comparison = "Compare the same premium measure for the same underlying, right, strike, and expiration when a current Wheelta board row supplies a screen used for this candidate. Absolute difference divided by the positive screen premium must not exceed data_quality.tolerances.board_vs_live_premium_divergence_ratio. Record both values and the row/build identity. Missing or stale evidence for a board-derived candidate blocks that candidate; do not relabel it as independently discovered to bypass the check. For a covered call or a contract discovered independently through Robinhood or held shares with no matching screen used, record not_applicable and rely on Robinhood. If the board is unavailable, skip board work while independently sourced work may continue."
sizing = [
  "Contracts = floor of the smallest applicable capacity below, expressed in contracts:",
  "limits.max_contracts_per_order;",
  "what limits.max_collateral_per_underlying_usd and limits.max_collateral_per_underlying_ratio allow (CSP);",
  "what available settled cash covers after limits.min_cash_reserve_usd, using definitions.cash_accounting (CSP);",
  "uncovered shares / contract multiplier, within limits.cc_max_lot_coverage_ratio (CC).",
  "Zero means no trade.",
]
ranking = [
  "Higher annualized yield on collateral.",
  "Then lower absolute delta.",
  "Then a tighter spread.",
]
portfolio_caps = [
  "limits.max_new_positions_per_run and limits.max_new_positions_per_day.",
  "limits.max_total_csp_collateral_ratio.",
  "limits.max_sector_concentration_ratio.",
  "limits.max_correlated_exposure.",
]

# ---------------------------------------------------------------------------------------------
# Loss and circuit breakers
# ---------------------------------------------------------------------------------------------

[circuit_breakers]
max_daily_drawdown_usd = "none" # owner, 2026-09-25: no daily loss breaker
on_max_daily_drawdown = "Realized plus unrealized loss for the day at or beyond max_daily_drawdown_usd: no new opens for the rest of the day."
# Applied by the orchestrator and the operator, not by the agent; rendered for completeness.
max_consecutive_run_failures = 3
on_max_consecutive_run_failures = "Operator alert; the operator decides on the kill switch."
# Applied by the post-run audit, not by the agent (docs/VALIDATION.md, ADR-0014).
max_consecutive_unverifiable_runs = 3
on_max_consecutive_unverifiable_runs = "Operator alert when the same audit check is unverifiable in this many consecutive completed runs."

# ---------------------------------------------------------------------------------------------
# Agentic workspace (Tier S) caps. The PreToolUse hook also enforces these.
# ---------------------------------------------------------------------------------------------

[workspace]
# Robinhood's own limits on these objects are undocumented; these are modest local caps.
max_owned_watchlists = 5
max_items_per_owned_watchlist = 50
max_owned_scans = 5
max_owned_alerts = 50
max_mutations_per_run = 25

# ---------------------------------------------------------------------------------------------
# Data quality (docs/DATA_QUALITY.md explains the pipeline these values feed)
# ---------------------------------------------------------------------------------------------

[data_quality]
precedence_rule = "For each fact, the first listed source in data_quality.precedence wins; a disagreement follows on_divergence. A source not listed for a fact never supplies it: web content never supplies prices, strikes, premiums, Greeks, positions, or buying power."

[data_quality.freshness]
notes = ["Runs happen only during the NYSE regular session, so each max age is for regular hours."]
option_quote_max_age_seconds = 60 # each price step re-quotes anyway (orders.working)
equity_quote_max_age_seconds = 60
account_state_max_age_seconds = 120 # also re-read before every order (procedure step 4)
wheelta_board = "Current buildId only; never an older board."
wheelta_macro_snapshot_max_age_seconds = 86400 # Wheelta refreshes macro once a day, 07:35 ET
earnings_calendar_max_age_seconds = 86400
news_max_age_seconds = 3600

[data_quality.sanity]
notes = ["An IV outside [min_iv_ratio, max_iv_ratio] fails the sanity check; treat that quote as missing."]
min_iv_ratio = "0.05"
max_iv_ratio = "5.00"

[data_quality.tolerances]
board_vs_live_premium_divergence_ratio = "0.25" # board premiums are up to ~2 h old (build schedule)
fundamentals_divergence_ratio = "0.05"

[[data_quality.precedence]]
fact = "Live option price and Greeks"
sources = ["Robinhood live"]
on_divergence = "Wheelta board strikes, premiums, Greeks, and probOtm are a build-time screen: re-quote from Robinhood before relying on them. Apply selection.board_comparison only when a matching board screen was used; a covered call or an independently discovered contract does not require a board premium."

[[data_quality.precedence]]
fact = "Account state (positions, buying power, orders)"
sources = ["Robinhood"]
on_divergence = "n/a"

[[data_quality.precedence]]
fact = "Earnings date"
sources = ["Company IR or SEC (tier 1)", "Robinhood earnings", "Wheelta calendar", "Tier-2 web"]
on_divergence = "Any disagreement between tier-1 or broker sources is a contradiction."

[[data_quality.precedence]]
fact = "Ex-dividend date"
sources = ["Company IR or exchange notice", "Robinhood", "Wheelta calendar"]
on_divergence = "Any disagreement between tier-1 or broker sources is a contradiction."

[[data_quality.precedence]]
fact = "Fundamentals"
sources = ["SEC filing facts", "Robinhood financials and fundamentals", "Wheelta research"]
on_divergence = "Beyond data_quality.tolerances.fundamentals_divergence_ratio: flag."

[[data_quality.precedence]]
fact = "News and catalysts"
sources = ["Tier 1", "Tier 2"]
on_divergence = "A tier-3-only claim is low_confidence and cannot support a trade."

[[data_quality.source_tiers]]
tier = 1
sources = "Regulators and exchanges (SEC, OCC, exchange notices) and the company itself (investor relations, press releases)."
use = "Can support a trade."

[[data_quality.source_tiers]]
tier = 2
sources = "Established financial news outlets with named authorship."
use = "Can support a trade."

[[data_quality.source_tiers]]
tier = 3
sources = "Everything else, including forums, social media, anonymous posts, and content farms."
use = "Ignore. A claim supported only by tier 3 cannot support a trade."
