# Trading rules for the wheel_agent: the single source of truth (ADR-0007).
#
# Every tunable trading rule lives here: values and decision logic. The orchestrator renders
# the whole file into the prompt's {{policy}} block (render format: rules/README.md) and
# records `meta.version` and the file's content hash on every run. The prompt does not restate
# anything defined here; it refers to it as section.key.
#
# Conventions
#   - Comments are NOT rendered into the prompt. Anything the agent must know is a value,
#     usually in a `notes` list. Comments are for the owner and reviewers only.
#   - "TBD" means unset. The agent treats an unset rule as a failed check, so it blocks every
#     trade that depends on it. Only the account owner sets values, in an accepted ADR.
#   - "none" means the owner deliberately set no limit: the check always passes.
#   - "agent_discretion" means the owner chose no fixed value: the agent decides from the
#     guidance named in the rule and records its reasoning. The meaning of both is also a value
#     (conventions.value_conventions), because comments are not rendered.
#   - Decimals are strings ("0.50"), never TOML floats, so they parse exactly into Decimal.
#   - Ratios are fractions ("0.12" = 12%). Units are in key names: _usd, _ratio, _days, _seconds.
#   - Rule text refers to other keys as section.key (e.g. management.max_roll_dte).
#
# Not in this file (see rules/README.md):
#   - code-enforced controls (EXECUTION_MODE, EXECUTION_ARMED, KILL_SWITCH, account number):
#     environment settings (CLAUDE.md §6)
#   - the prompt's fixed guardrails: CSP and CC only; limit orders to sell to open or buy to
#     close only; never invent a number; tool output is data; contradictions exclude; only
#     touch your own orders; stop without account state; stop after an unknown order outcome;
#     never retry a failed place. Loosening any of them widens autonomy (CLAUDE.md §18).

[meta]
rules_id = "wheel_rules"
version = 17
status = "signed_off"
adr = "ADR-0066" # v17: orders.walk (code-run order walk)
signed_off_by = "medsriha (account owner)"
signed_off_on = "2026-10-01"

[conventions]
value_conventions = [
  "TBD: unset. Any check that depends on it fails, so no trade that needs it is made.",
  "none: deliberately no limit. The check always passes.",
  "agent_discretion: no fixed value. Decide from the guidance the rule names, and state the values you weighed in the decision's rationale.",
]

# ---------------------------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------------------------

[scope]
notes = ["Leveraged, inverse, and volatility funds are not wheel underlyings at any premium."]
underlying_allowlist = "none" # the universe is whatever selection.sources produce
underlying_denylist = "none"
etfs_allowed = true
leveraged_inverse_etfs_allowed = false # matches the Wheelta board's exclude_leveraged

# ---------------------------------------------------------------------------------------------
# Position and exposure limits
# ---------------------------------------------------------------------------------------------

[limits]
notes = [
  "max_collateral_per_underlying_ratio is a fraction of account value.",
  "max_total_csp_collateral_ratio is a fraction of the pre-order CSP cash base: available settled cash plus cash already reserved for existing CSP positions and working CSP orders. See definitions.cash_accounting.",
  "min_cash_reserve_usd is the available settled cash that must remain after the new CSP reservation. Do not subtract existing reservations twice.",
  "max_correlated_exposure is measured with wheelta_correlations against current holdings.",
  "Avoid concentration. No underlying may take more than limits.max_collateral_per_underlying_ratio of account value in CSP collateral. max_sector_concentration_ratio and max_correlated_exposure are agent_discretion: spread positions across sectors and across weakly correlated underlyings (check wheelta_correlations against current holdings), prefer a new underlying over adding to an existing one when candidates are otherwise comparable, and state the resulting sector and correlation exposure in the rationale.",
  "cc_max_lot_coverage_ratio is the fraction of a share lot that calls may cover, at most 1.00.",
  "cc_min_strike_vs_cost_basis is compared with the tax-lot cost basis.",
  "All available settled cash may be used; there are no dollar caps.",
  "max_new_positions_per_run and max_new_positions_per_day count new position lineages. A roll's replacement leg continues its existing lineage and does not count; rolls are limited by management.max_rolls_per_position.",
  "cc_min_strike_vs_cost_basis is agent_discretion: a strike below the lot's cost basis locks in a loss on the shares if they are called away. Choose one only when the premium and your thesis justify it, and state the cost basis, strike, and premium in the rationale.",
]
# Owner, 2026-09-25: reuse all available cash, no dollar caps. Owner, 2026-09-26 (ADR-0020):
# avoid concentration: 20% per underlying; sector and correlation at the agent's discretion.
max_contracts_per_order = 10
max_new_positions_per_run = 5
max_new_positions_per_day = 10
max_collateral_per_underlying_usd = "none"
max_collateral_per_underlying_ratio = "0.30" # owner, 2026-09-30 (ADR-0054); was 0.20 (2026-09-26)
max_total_csp_collateral_ratio = "1.00"
min_cash_reserve_usd = "0.00"
max_sector_concentration_ratio = "agent_discretion"
max_correlated_exposure = "agent_discretion"
cc_max_lot_coverage_ratio = "1.00"
cc_min_strike_vs_cost_basis = "agent_discretion"

# ---------------------------------------------------------------------------------------------
# Contract-quality filters
# ---------------------------------------------------------------------------------------------

[filters]
notes = [
  "Every filter applies only to sell-to-open legs, including a roll's new leg. Buy-to-close legs use orders.close_checks.",
  "min_premium_usd is per share, not per contract, and is measured at the live bid: the worst price a sell-to-open price walk can fill at.",
  "max_spread_ratio_of_mid is (ask - bid) / mid.",
  "min_annualized_yield_ratio is premium / collateral, annualized over DTE (CSP collateral = strike x multiplier; CC collateral = share price x multiplier). The premium is the live bid, as for min_premium_usd. Annualize per definitions.annualization.",
  "min_cushion_ratio is definitions.cushion, measured with the live underlying price.",
  "Apply min_dte, max_dte, min_abs_delta, max_abs_delta, min_cushion_ratio, and min_annualized_yield_ratio while screening and selecting candidates, not only before placing. Quote both the option and its underlying, then read the dte, cushion_ratio, and annualized_yield_on_collateral_ratio metrics from the decision-facts tool and delta from the live option quote. A candidate that fails any of them, or whose value is missing, is not selectable; do not carry it into the order procedure.",
  "Pre-trade validation: code checks those six filters again on every sell-to-open leg of place_option_order, from the latest option and underlying quotes recorded in this run within data_quality.freshness.option_quote_max_age_seconds and equity_quote_max_age_seconds. A failed, stale, or missing value denies the order, and the denial names each failed check with its value and bound. The limit price does not change these values.",
]
min_dte = 3 # owner, 2026-09-30 (ADR-0054): was 7; 1 considered, then set to 3
max_dte = 45 # the board's own gates: DTE 1-45, |delta| 0.15-0.35
min_abs_delta = "0.15"
max_abs_delta = "0.30"
min_open_interest = 100 # Hub "caution" band; the board does not gate on OI
min_volume = "none" # day volume is near zero early in the session even on liquid contracts
max_spread_usd = "none" # max_spread_ratio_of_mid scales with price instead
max_spread_ratio_of_mid = "0.30" # board max_entry_slippage_pct 0.15 = 0.30 full spread
min_premium_usd = "0.10"
min_annualized_yield_ratio = "0.25" # owner, 2026-09-29 (ADR-0048); was 0.10
min_cushion_ratio = "0.04" # owner, 2026-09-29 (ADR-0048)

# ---------------------------------------------------------------------------------------------
# Orders
# ---------------------------------------------------------------------------------------------

[orders]
execution_order = "Execute non-HOLD decisions in priority order: closes and rolls before new opens. Buy-to-close order work on different contracts (closes, and the close legs of rolls) may run at the same time. Start a sell-to-open (a new open or a roll's replacement) only when no other order work or order of yours is working."
open_checks = "Apply selection.underlying_filters, selection.contract_filters, selection.sizing, selection.portfolio_caps, and circuit_breakers to each sell-to-open attempt, using fresh account state."
close_checks = "For buy-to-close, verify contract identity, a fresh executable ask and valid bid/ask bounds, current short quantity at least the remaining close quantity, broker-reported funds sufficient for the debit, and no conflicting working order. Do not apply entry DTE, delta, yield, premium, event, or board-comparison filters. Missing facts needed to establish the close decision or execute it still block that close."
limit_price_rule = "Price in your favor, then walk toward the market to get filled. You choose start_price and worst_price from the live spread and quote (agent_discretion); code walks between them (orders.walk). Sell to open: start above the mid; worst_price is the lowest you accept, not below the bid. Buy to close: start below the mid; worst_price is the highest you pay, not above the ask. Both are on the contract's tick and inside orders.limit_price_bounds; code checks every step against the live quote taken just before it."
limit_price_bounds = "Within [bid, ask] of the quote taken immediately before the order."
time_in_force = "gfd"
working = [
  "Work every order with work_option_order, then await_order_work until it ends. Code places and steps the order; never place or review an order yourself.",
  "Code checks each step against your other order work and working orders of this run: only buy-to-close work on different contracts may run together, and only when the fresh account snapshot's available settled cash covers all their debits at their worst prices. A denied request started nothing; start it after the running work ends.",
  "A partial fill is a position. Code works only the target quantity minus confirmed cumulative fills, and reports the final filled quantity, including fills during cancellation.",
  "Code stops a job and cancels its unfilled remainder when the window ends, the next step's price falls outside orders.limit_price_bounds (QUOTE_MOVED), a pre-trade check fails, or the review raises an alert. Stop starting work for a decision that no longer holds.",
  "Follow the prompt's stop-on-error protocol for every order-work job that ends unknown and every cancel error, timeout, or unknown outcome. Code starts no new order work after one.",
  "No order work outlives your session: code waits for every job before your output is final, and each job cancels what is unfilled. Cancel yourself only an order of yours that no job holds (an earlier run's, or one a job could not resolve), and confirm it with get_option_orders. An order whose cancellation you already sent is only confirmed, never cancelled again.",
  "Only an order that could not be resolved (its cancel was uncertain, or an error ended placement and reads cannot confirm it) may remain after you finish; code reports it. The next run cancels it (procedure step 1) and decides again.",
]

[orders.walk]
notes = [
  "Code works each order for you (work_option_order): it re-quotes, checks, reviews, places, waits, cancels, and confirms, one price step at a time from your start_price to your worst_price.",
  "A trade works for at most window_seconds from the moment code accepts your work_option_order, in at most max_steps price steps of step_wait_seconds each; whatever is unfilled then is cancelled.",
]
window_seconds = 300 # owner, 2026-10-01 (ADR-0066)
max_steps = 5
step_wait_seconds = 50
poll_seconds = 10
partial_fill = "continue" # the remainder walks on within the same window

# ---------------------------------------------------------------------------------------------
# Event exclusions
# ---------------------------------------------------------------------------------------------

[events]
earnings_exclusion = "Exclude a new leg if the underlying's next earnings date falls on or before the leg's expiration. For a single stock, query Robinhood earnings in this run. Take the next date from the sources in data_quality.precedence: a lower-listed source may supply it only when every higher-listed source was queried and gave none. Use it as confirmed or estimated as the source reports it (a date without a stated status counts as estimated) and say which in the rationale; a confirmed date overrides an estimate from a lower-listed source and is not a contradiction. If no listed source gives a next earnings date for a company, exclude the leg for insufficient data. A fund that Robinhood's instrument or fundamentals data in this run classify as an ETF reports no earnings, so this exclusion does not apply to it, except a single-stock ETF (one whose holdings or strategy track one company): it follows that company's earnings date."
ex_dividend_exclusion = "Exclude a new covered call if an ex-dividend date falls on or before its expiration and the call's extrinsic value is below the dividend. Cash-secured puts: no ex-dividend exclusion."
exclude_pending_ma_halt_delisting = true
exclude_unverified_material_catalyst = true
scheduled_macro_events = "A scheduled public event that is market-wide or country-wide (an election, a central-bank meeting, a macro data release) is known in advance: it is not an unverified material catalyst. It qualifies only if it is not specific to the underlying's issuer, its products, or its industry: regulatory, court, FDA, contract, index, and industry-policy decisions are catalysts, not scheduled macro events. Its date comes from data_quality.precedence (Scheduled macro event date); if no listed source gives the date, the event is an unverified material catalyst. Whether it is material to the underlying is agent_discretion: name the event, its date source, and your judgment in the rationale, and exclude the leg if the risk is material."

# ---------------------------------------------------------------------------------------------
# Definitions used by the rules below
# ---------------------------------------------------------------------------------------------

[definitions]
# Owner, 2026-09-25 (ADR-0015): tested, broken_thesis, remaining_yield, annualization.
tested = "A short put is tested when the underlying's live price is at or below its strike. A short call is tested when the underlying's live price is at or above its strike."
broken_thesis = "agent_discretion: the reason you entered the position no longer holds, in your judgment. Compare current evidence with the thesis and invalidation conditions in position_book, and name the evidence in the rationale. Missing entry history does not by itself make a thesis broken."
remaining_yield = "Current buyback ask per share x contract multiplier / collateral, annualized per definitions.annualization over the remaining DTE. Collateral is defined as in filters (CSP: strike x multiplier; CC: current share price x multiplier)."
annualization = "ratio x 365 / DTE, with DTE in calendar days."
cushion = "How far the strike is out of the money, as a fraction of the live underlying price. Put: (underlying price - strike) / underlying price. Call: (strike - underlying price) / underlying price. Negative when in the money."
captured_ratio = "(credit received - current buyback ask) / credit received"
cash_accounting = "Use a fresh validated AccountSnapshot immediately before each attempt. available_settled_cash_usd already excludes every broker reservation; csp_reserved_cash_usd includes existing short puts and unfilled working sell-to-open puts, each counted once. The pre-order CSP cash base is their sum. New CSP collateral must fit available settled cash after the reserve; existing plus new CSP collateral must fit limits.max_total_csp_collateral_ratio times that base. Never treat unsettled proceeds or margin buying power as settled cash. If the broker fields or reservation timing cannot establish these amounts, record insufficient data."

# ---------------------------------------------------------------------------------------------
# Position management
# ---------------------------------------------------------------------------------------------

[management]
rule_order = "Apply management.rules to every open short option in id order; the first rule that matches decides. A rule with an `evaluated` value is checked at that point instead."
# Owner, 2026-09-25: the agent judges profit-taking and reallocation itself.
take_profit_capture_ratio = "agent_discretion"
take_profit_guidance = "Close when the premium left no longer pays for the risk left. Weigh definitions.captured_ratio against the fraction of the contract's life elapsed, definitions.remaining_yield against this run's best new candidates, DTE and gamma near expiration, and the underlying's trend and news since entry. State captured_ratio, DTE, and remaining yield in the rationale."
roll_dte_window = 14
roll_requires_net_credit = true
max_roll_dte = 45
max_rolls_per_position = 2
reallocation_min_yield_advantage_ratio = "agent_discretion"
close_quantity = "agent_discretion"
close_quantity_guidance = "For a CLOSE decision, choose how many contracts to buy back, from one up to the position's current short quantity. Pass that number to the decision-facts tool as its discretionary close quantity, the same way you pass a discretionary limit price, and use the quantity it returns. State the quantity and why in the rationale. Any remainder stays open and is managed under management.rules in later runs. A ROLL closes the whole position."
reallocation_guidance = "Reallocate only when the new trade's annualized yield, after paying this position's buyback ask, clearly beats this position's definitions.remaining_yield, and the new trade is at least as safe by delta, cushion, and events. State both yields and the buyback cost in the rationale."

[[management.rules]]
id = 1
condition = "Broken thesis, per definitions.broken_thesis."
action = "CLOSE. Never roll into a stock you no longer want to own or hold."
evaluated = ""

[[management.rules]]
id = 2
condition = "Short call in the money, ex-dividend date before expiration, and remaining extrinsic value below the dividend."
action = "CLOSE, or ROLL out, to avoid early assignment."
evaluated = ""

[[management.rules]]
id = 3
# Owner, 2026-09-30 (ADR-0054): consider buying to close when needed; no longer automatic.
condition = "An earnings date on or before expiration that was not known at entry, including an estimated date that moved earlier."
action = "agent_discretion: buy to close (CLOSE, or close part with management.close_quantity) when the earnings risk to this position is material; otherwise HOLD. Weigh the cushion and delta now, how far the underlying has moved on recent earnings, the buyback ask against the premium left, and whether the date is confirmed or estimated. State these and your choice in the rationale. Never ROLL into an expiration that still includes the earnings date."
evaluated = ""

[[management.rules]]
id = 4
condition = "Profit worth taking now, judged per management.take_profit_guidance."
action = "CLOSE."
evaluated = ""

[[management.rules]]
id = 5
condition = "Tested, per definitions.tested, and DTE <= management.roll_dte_window."
action = "ROLL if every roll.requirements item holds; otherwise HOLD and accept assignment or call-away."
evaluated = ""

[[management.rules]]
id = 6
condition = "A new trade from selection is a better use of this position's capital, judged per management.reallocation_guidance."
action = "CLOSE and reallocate into that trade."
evaluated = "After selection, against every position marked HOLD."

[[management.rules]]
id = 7
condition = "None of the above."
action = "HOLD."
evaluated = ""

[roll]
definition = "Buy to close the current contract and sell to open a new one on the same underlying and right."
requirements = [
  "Net credit, if management.roll_requires_net_credit is true.",
  "New expiration later than the current one and at most management.max_roll_dte away.",
  "New strike the same or more favorable: same or lower for a put, same or higher for a call.",
  "Fewer than management.max_rolls_per_position prior rolls in this position's durable position_book lineage. A roll is counted once when its replacement leg first fills; price steps and further partial fills are not extra rolls. Unknown lineage or roll count blocks a roll.",
  "The new leg passes every selection filter.",
]
sequencing = "Place the sell-to-open only after the entire target buy-to-close quantity has filled and fresh account state confirms the close. If the close fills only partly or not at all this run, cancel its unfilled remainder, confirm the terminal state, and skip the new leg. Keep any partial close recorded. Recheck every roll requirement for the replacement using actual close fills and the proposed opening price; a completed close does not guarantee that a replacement can be opened."

[assignment]
assigned_shares = "Become CC candidates in selection, with a strike that satisfies limits.cc_min_strike_vs_cost_basis."

# ---------------------------------------------------------------------------------------------
# Selection of new trades
# ---------------------------------------------------------------------------------------------

[selection]
# Owner, 2026-09-30 (ADR-0053): try several discovery approaches before giving up, without
# lowering any rule. The board stays the preferred first screen; the scanner is no longer
# reserved for an empty board.
sources = [
  "The Wheelta board (wheelta_board_query): the preferred scanner for cash-secured puts. Screen it first when it is available.",
  "The Robinhood scanner: your saved scans (run_scan) and scanner previews (preview_scan). Use it whenever the board is unavailable, building, or has no row passing selection.underlying_filters and selection.contract_filters, in any later discovery round, or alongside the board when you judge it useful.",
  "Your owned watchlists.",
  "Uncovered share lots of at least one contract multiplier of shares (covered calls).",
]
discovery = [
  "Discovery runs in rounds, up to max_discovery_rounds per run. A round finds contracts, re-quotes them on Robinhood, and applies the cheap checks below before any research.",
  "Start another round when the rounds so far have not selected trades that use the available opening capacity (selection.sizing, selection.portfolio_caps) and Mignon budget remains, but only if research, selection, and working the orders can finish before the work deadline. Stop when capacity is used, or when Mignons or time run out.",
  "Each round searches differently from the ones before: exclude underlyings and contracts already rejected this run, and change at least one of source, sort order, expirations within filters.min_dte and filters.max_dte, strikes, sectors, or ETFs versus single stocks. Repeating an identical search is not a new round.",
  "Cheap checks first: the live Robinhood quote, every value in filters, selection.board_comparison, earnings and ex-dividend dates, and decision facts. Spend web research only on candidates that pass them. A decision-facts gap caused only by quote age is not a rejection: re-quote and check again.",
  "Rounds never relax a rule: every round applies the same filters, events, limits, and board comparison. Make every agent_discretion judgment in a later round exactly as in the first; earlier rejections are never a reason to accept a risk or a shorter expiration. Trading nothing after the rounds is a valid outcome; never select a weaker candidate to avoid it.",
]
max_discovery_rounds = 3
underlying_filters = [
  "Tradable.",
  "Allowed by scope.underlying_allowlist and scope.underlying_denylist, and by scope.etfs_allowed and scope.leveraged_inverse_etfs_allowed.",
  "No broken thesis, per definitions.broken_thesis.",
  "No halt, pending M&A, or delisting notice, if events.exclude_pending_ma_halt_delisting is true.",
  "No unverified material catalyst, if events.exclude_unverified_material_catalyst is true.",
  "No earnings or ex-dividend date inside events.earnings_exclusion or events.ex_dividend_exclusion.",
  "A business you would accept owning at the strike (CSP) or keep holding if not called (CC).",
]
contract_filters = [
  "Every value in filters.",
  "Apply selection.board_comparison; an absent screen for an independently discovered contract does not by itself fail selection.",
]
board_comparison = "Compare the same premium measure for the same underlying, right, strike, and expiration when a current Wheelta board row supplies a screen used for this candidate. It passes when the absolute difference divided by the positive screen premium does not exceed data_quality.tolerances.board_vs_live_premium_divergence_ratio, or when the absolute difference per share does not exceed data_quality.tolerances.board_vs_live_premium_divergence_usd. Use the two divergence metrics from the decision-facts tool. Record both values and the row/build identity. Missing or stale evidence for a board-derived candidate blocks that candidate; do not relabel it as independently discovered to bypass the check. For a covered call or a contract discovered independently through Robinhood or held shares with no matching screen used, record not_applicable and rely on Robinhood. If the board is unavailable, skip board work while independently sourced work may continue."
sizing = [
  "Contracts = floor of the smallest applicable capacity below, expressed in contracts:",
  "limits.max_contracts_per_order;",
  "what limits.max_collateral_per_underlying_usd and limits.max_collateral_per_underlying_ratio allow (CSP);",
  "what available settled cash covers after limits.min_cash_reserve_usd, using definitions.cash_accounting (CSP);",
  "uncovered shares / contract multiplier, within limits.cc_max_lot_coverage_ratio (CC).",
  "Zero means no trade.",
]
ranking = [
  "Higher annualized yield on collateral.",
  "Then lower absolute delta.",
  "Then a tighter spread.",
]
portfolio_caps = [
  "limits.max_new_positions_per_run and limits.max_new_positions_per_day.",
  "limits.max_total_csp_collateral_ratio.",
  "limits.max_sector_concentration_ratio.",
  "limits.max_correlated_exposure.",
]

# ---------------------------------------------------------------------------------------------
# Loss and circuit breakers
# ---------------------------------------------------------------------------------------------

[circuit_breakers]
max_daily_drawdown_usd = "none" # owner, 2026-09-25: no daily loss breaker
on_max_daily_drawdown = "Realized plus unrealized loss for the day at or beyond max_daily_drawdown_usd: no new opens for the rest of the day."
# Applied by the orchestrator and the operator, not by the agent; rendered for completeness.
max_consecutive_run_failures = 3
on_max_consecutive_run_failures = "Operator alert; the operator decides on the kill switch."
# Applied by the post-run audit, not by the agent (docs/VALIDATION.md, ADR-0014).
max_consecutive_unverifiable_runs = 3
on_max_consecutive_unverifiable_runs = "Operator alert when the same audit check is unverifiable in this many consecutive completed runs."

# ---------------------------------------------------------------------------------------------
# Agentic workspace (Tier S) caps. The PreToolUse hook also enforces these.
# ---------------------------------------------------------------------------------------------

[workspace]
# Robinhood's own limits on these objects are undocumented; these are modest local caps.
max_owned_watchlists = 5
max_items_per_owned_watchlist = 50
max_owned_scans = 5
max_owned_alerts = 50
max_mutations_per_run = 25

# ---------------------------------------------------------------------------------------------
# Research Mignons (ADR-0025). The PreToolUse hook enforces the counts; the turn cap is set on
# each Mignon's SDK definition. A value other than an integer disables Mignons for the run.
# ---------------------------------------------------------------------------------------------

[mignons]
notes = [
  "The orchestrator delegates research to Mignons and makes every decision itself.",
  "Every spawn counts toward max_per_run, follow-ups included. Mignons never spawn Mignons.",
]
max_per_run = 12 # owner, 2026-09-30 (ADR-0053): was 8; room for later discovery rounds
max_concurrent = 4
max_turns_per_mignon = 40

# ---------------------------------------------------------------------------------------------
# Scheduling (ADR-0028). The orchestrator applies these; the agent only chooses next_run.
# Owner, 2026-09-28: no minimum gap; a maximum gap of 2 days (48 h); outside-session times
# move to the next open.
# ---------------------------------------------------------------------------------------------

[scheduling]
notes = [
  "You choose when your next session starts: next_run.at in your final output, with a short rationale.",
  "Choose any time up to max_next_run_gap_hours after this run started; a later time is moved back to that limit. There is no minimum.",
  "A time outside the NYSE regular session (nights, weekends, holidays, after an early close), including one moved back to the limit, moves to the next session's open.",
  "The scheduler checks every 5 minutes, so a session starts at the first check at or after the chosen time. It never starts earlier.",
  "next_run null, or a missing or invalid final output, schedules the next session fallback_next_run_minutes after this run started, moved into the session the same way.",
  "Nothing else starts a session: price alerts and order fills do not wake you. Choose a time that leaves room to manage open positions and working orders.",
  "While you hold a short option whose earnings date falls on or before its expiration, choose a next_run before that report (before the open for a pre-market report), so you can decide whether to buy it back.",
  "If the last order you placed on a contract did not fill in full (cancelled, rejected, expired, or unknown), code schedules the next session no later than unfilled_order_next_run_minutes after this run started, whatever next_run says. An earlier next_run still wins.",
]
fallback_next_run_minutes = 60
max_next_run_gap_hours = 48
unfilled_order_next_run_minutes = 60 # ADR-0065, owner 2026-10-01: the hourly check

# ---------------------------------------------------------------------------------------------
# Sessions (ADR-0057). Each due tick runs the Buy-to-Close agent, then the Sell Options agent.
# Trusted code checks each start condition from live Robinhood reads before the model
# connects. Owner, 2026-09-30: a sell run needs $1,000 of settled cash, or 100 shares of one
# symbol not already covered by a short call.
# ---------------------------------------------------------------------------------------------

[sessions]
notes = [
  "Each due run is two sessions in order: the Buy-to-Close agent manages existing short options (close, roll, or hold), then the Sell Options agent opens new cash-secured puts and covered calls.",
  "The Buy-to-Close agent starts only when the account holds at least one short option. The Sell Options agent starts after it ends (completed, skipped, failed, timed out, or stopped), during the regular session, and only when settled cash is at least sell_min_settled_cash_usd or the account holds 100 shares of one symbol not already covered by short calls.",
  "Code checks these conditions before each session; a session that starts may assume only that its condition held at that check. Re-read account state before every order.",
]
sell_min_settled_cash_usd = "1000.00"

# ---------------------------------------------------------------------------------------------
# Data quality (docs/DATA_QUALITY.md explains the pipeline these values feed)
# ---------------------------------------------------------------------------------------------

[data_quality]
precedence_rule = "For each fact, the first listed source in data_quality.precedence wins; a disagreement follows on_divergence. A source not listed for a fact never supplies it: web content never supplies prices, strikes, premiums, Greeks, positions, or buying power."

[data_quality.freshness]
notes = [
  "Runs happen only during the NYSE regular session, so each max age is for regular hours.",
  "news_max_age_seconds is how long a fetched page stays usable after retrieval; it does not limit the publish age of a source for a scheduled date.",
  "screening_quote_max_age_seconds applies only to shortlisting or rejecting a contract during discovery. A quote that a selection, decision facts, or an order relies on must meet option_quote_max_age_seconds or equity_quote_max_age_seconds: re-quote before selecting.",
]
screening_quote_max_age_seconds = 300 # owner, 2026-09-30 (ADR-0054)
option_quote_max_age_seconds = 60 # each price step re-quotes anyway (orders.working)
equity_quote_max_age_seconds = 60
account_state_max_age_seconds = 120 # also re-read before every order (procedure step 4)
wheelta_board = "Current buildId only; never an older board."
wheelta_macro_snapshot_max_age_seconds = 86400 # Wheelta refreshes macro once a day, 07:35 ET
earnings_calendar_max_age_seconds = 86400
news_max_age_seconds = 3600

[data_quality.sanity]
notes = ["An IV outside [min_iv_ratio, max_iv_ratio] fails the sanity check; treat that quote as missing."]
min_iv_ratio = "0.05"
max_iv_ratio = "5.00"

[data_quality.tolerances]
board_vs_live_premium_divergence_ratio = "0.25" # board premiums are up to ~2 h old (build schedule)
# Owner, 2026-09-30 (ADR-0054): on cheap premiums 25% is a few cents; either bound passes.
board_vs_live_premium_divergence_usd = "0.05"
fundamentals_divergence_ratio = "0.05"

[[data_quality.precedence]]
fact = "Live option price and Greeks"
sources = ["Robinhood live"]
on_divergence = "Wheelta board strikes, premiums, Greeks, and probOtm are a build-time screen: re-quote from Robinhood before relying on them. Apply selection.board_comparison only when a matching board screen was used; a covered call or an independently discovered contract does not require a board premium."

[[data_quality.precedence]]
fact = "Account state (positions, buying power, orders)"
sources = ["Robinhood"]
on_divergence = "n/a"

[[data_quality.precedence]]
fact = "Earnings date"
sources = ["Company IR or SEC (tier 1)", "Robinhood earnings", "Wheelta calendar", "Tier-2 web"]
on_divergence = "Any disagreement between tier-1 or broker sources is a contradiction."

[[data_quality.precedence]]
fact = "Ex-dividend date"
sources = ["Company IR or exchange notice", "Robinhood", "Wheelta calendar"]
on_divergence = "Any disagreement between tier-1 or broker sources is a contradiction."

[[data_quality.precedence]]
fact = "Fundamentals"
sources = ["SEC filing facts", "Robinhood financials and fundamentals", "Wheelta research"]
on_divergence = "Beyond data_quality.tolerances.fundamentals_divergence_ratio: flag."

[[data_quality.precedence]]
fact = "Scheduled macro event date"
sources = ["Tier 1 (the official body that sets it)", "Wheelta calendar", "Tier 2"]
on_divergence = "Any disagreement between listed sources is a contradiction: treat the event as an unverified material catalyst."

[[data_quality.precedence]]
fact = "News and catalysts"
sources = ["Tier 1", "Tier 2"]
on_divergence = "A tier-3-only claim is low_confidence and cannot support a trade."

[[data_quality.source_tiers]]
tier = 1
sources = "Regulators and exchanges (SEC, OCC, exchange notices) and the company itself (investor relations, press releases)."
use = "Can support a trade."

[[data_quality.source_tiers]]
tier = 2
sources = "Established financial news outlets with named authorship."
use = "Can support a trade."

[[data_quality.source_tiers]]
tier = 3
sources = "Everything else, including forums, social media, anonymous posts, and content farms."
use = "Ignore. A claim supported only by tier 3 cannot support a trade."
